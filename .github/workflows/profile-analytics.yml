name: Refresh profile analytics

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile-analytics.yml

permissions:
  contents: read

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Collect public GitHub data and refresh local files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Commit generated files when their content changes
        run: |
          git add -- README.md assets/activity.svg assets/languages.svg
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile analytics'
          git push
